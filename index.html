<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#e7e3da">
<title>emoji-map</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<style>
	/* ------------------------------------------------------------------
	   自定义 Web shell（替代 Godot 默认的「LOGO + 进度条」加载页）
	   · 背景取游戏自身的底色 #e7e3da，加载完直接无缝进入，看不到切换
	   · 引擎自带的 splash 图（#status-splash）彻底隐藏，不暴露引擎
	   · 进度条压成 2px 细线，下方一行小字
	   ------------------------------------------------------------------ */
	html, body, #canvas {
		margin: 0;
		padding: 0;
		border: 0;
	}

	body {
		color: #2b2b2b;
		background-color: #e7e3da;
		overflow: hidden;
		touch-action: none;
		-webkit-tap-highlight-color: transparent;
		-webkit-user-select: none;
		user-select: none;
	}

	#canvas {
		display: block;
	}

	#canvas:focus {
		outline: none;
	}

	#status {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 16px;
		background-color: #e7e3da;
		visibility: hidden;
		z-index: 10;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
			"PingFang SC", "Microsoft YaHei", sans-serif;
		font-size: 13px;
		letter-spacing: 0.08em;
		color: #6b665c;
	}

	/* 引擎默认图标：直接不显示 */
	#status-splash {
		display: none !important;
	}

	#status-progress {
		-webkit-appearance: none;
		-moz-appearance: none;
		appearance: none;
		display: none;
		width: 160px;
		height: 2px;
		border: 0;
		border-radius: 2px;
		background-color: rgba(43, 43, 43, 0.14);
		overflow: hidden;
	}

	#status-progress::-webkit-progress-bar {
		background-color: rgba(43, 43, 43, 0.14);
	}

	#status-progress::-webkit-progress-value {
		background-color: #6b665c;
		transition: width 0.2s ease-out;
	}

	#status-progress::-moz-progress-bar {
		background-color: #6b665c;
	}

	#status-tip {
		display: none;
	}

	#status-notice {
		display: none;
		max-width: 32rem;
		margin: 0 2rem;
		padding: 1rem 1.2rem;
		border: 1px solid #c9c2b2;
		border-radius: 6px;
		background-color: #f2efe7;
		color: #4a4438;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: 12px;
		line-height: 1.6;
		letter-spacing: 0;
		text-align: left;
		white-space: pre-wrap;
		overflow: hidden;
		z-index: 1;
	}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png" />
</head>
<body>
	<canvas id="canvas">
		你的浏览器不支持 canvas。
	</canvas>

	<noscript>
		需要启用 JavaScript 才能运行。
	</noscript>

	<div id="status">
		<progress id="status-progress"></progress>
		<div id="status-tip">载入中</div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":61916,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusTip = document.getElementById('status-tip');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	let slowTimer = null;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			if (slowTimer) {
				clearTimeout(slowTimer);
			}
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusTip.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;

		// 超过 45 秒还没好，给个说明——省得用户以为死掉了
		if (mode === 'progress' && !slowTimer) {
			slowTimer = setTimeout(function () {
				if (initializing) {
					statusTip.textContent = '还在加载，网络有点慢…';
				}
			}, 45000);
		}
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('出现未知错误。');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = '这个浏览器缺少运行所需的特性：\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
	</script>
</body>
</html>
